<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin - Secure Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #ef4444;
            --red-dark: #b91c1c;
            --dark: #0a0a0a;
            --darker: #050505;
            --gray: #525252;
            --light: #f5f5f5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--darker);
            color: var(--light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Ambient Threat Glow */
        .ambient-glow {
            position: absolute;
            width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(239, 68, 68, 0.08) 0%, transparent 60%);
            z-index: 0;
            pointer-events: none;
        }

        .login-card {
            background: var(--dark);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 3rem 2.5rem;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            z-index: 10;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 20px rgba(239, 68, 68, 0.05);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header { text-align: center; margin-bottom: 2.5rem; }
        
        .icon-circle {
            width: 70px; height: 70px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--red);
            font-size: 2rem;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.2);
        }

        .header h2 { font-size: 1.5rem; font-weight: 900; letter-spacing: 0.1em; color: white; }
        .header h2 span { color: var(--red); }
        .header p { color: #737373; font-size: 0.9rem; margin-top: 0.4rem; font-weight: 500; }

        .input-group { margin-bottom: 1.2rem; position: relative; }
        
        .input-group input {
            width: 100%;
            background: #121212;
            border: 1px solid #262626;
            color: white;
            padding: 1rem 1rem 1rem 3rem;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        .input-group input:focus {
            border-color: var(--red);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.2);
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
            font-size: 1.1rem;
        }

        .btn-submit {
            width: 100%;
            padding: 1.1rem;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--red), var(--red-dark));
            color: white;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            cursor: pointer;
            margin-top: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.3);
        }

        .footer {
            text-align: center;
            color: var(--gray);
            font-size: 0.75rem;
            margin-top: 2.5rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="login-card">
        <div class="header">
            <div class="icon-circle">🛡️</div>
            <h2>ADMIN <span>PORTAL</span></h2>
            <p>Secure Management System</p>
        </div>

        <form onsubmit="handleAdminLogin(event)">
            <div class="input-group">
                <span class="input-icon">👤</span>
                <input type="text" id="admin-username" placeholder="Admin Username" required>
            </div>
            <div class="input-group">
                <span class="input-icon">🔒</span>
                <input type="password" id="admin-password" placeholder="Admin Password" required>
            </div>
            <button type="submit" class="btn-submit">SECURE LOGIN</button>
        </form>

        <div class="footer">
            ⚠️ Unauthorized access is strictly prohibited
        </div>
    </div>

    <script>
        async function handleAdminLogin(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.textContent;
            
            const username = document.getElementById('admin-username').value;
            const password = document.getElementById('admin-password').value;
            
            btn.textContent = 'AUTHENTICATING...';
            
            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('admin_token', 'true');
                    localStorage.setItem('admin_username', data.admin.username);
                    window.location.href = 'admin-dashboard.html';
                } else {
                    alert(data.error || 'Invalid admin credentials');
                }
            } catch (error) {
                alert('Error connecting to Server');
            } finally {
                btn.textContent = originalText;
            }
        }
    </script>
</body>
</html>
